name: ARM64 kernel

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "kernel/arm64/**"
      - "scripts/test_arm64_kernel.sh"
      - ".github/workflows/arm64-kernel.yml"
      - "Makefile"
  pull_request:
    paths:
      - "kernel/arm64/**"
      - "scripts/test_arm64_kernel.sh"
      - ".github/workflows/arm64-kernel.yml"
      - "Makefile"
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-system-arm
      - name: Build freestanding ARM64 kernel
        run: make -C kernel/arm64 CROSS_COMPILE=aarch64-linux-gnu-
      - name: Boot kernel and exercise serial shell
        run: |
          chmod +x scripts/test_arm64_kernel.sh
          CROSS_COMPILE=aarch64-linux-gnu- QEMU=qemu-system-aarch64 scripts/test_arm64_kernel.sh
