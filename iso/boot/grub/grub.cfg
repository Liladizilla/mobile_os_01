# Adizilla OS - GRUB Configuration
# Boot menu configuration

set timeout=5
set default=0

menuentry "Adizilla Mobile OS v1.0.0" {
    echo "Loading Adizilla OS..."
    linux16 /boot/adz_kernel.bin
    initrd16 /boot/adz_initrd.img
}

menuentry "Adizilla OS (Recovery Mode)" {
    echo "Loading Adizilla OS in recovery mode..."
    linux16 /boot/adz_kernel.bin recovery
    initrd16 /boot/adz_initrd.img
}

menuentry "Adizilla OS (Safe Graphics)" {
    echo "Loading Adizilla OS in safe graphics mode..."
    linux16 /boot/adz_kernel.bin safe
    initrd16 /boot/adz_initrd.img
}

menuentry "Shutdown" {
    echo "Shutting down..."
    halt
}
